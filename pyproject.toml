# Pytest 配置文件
[tool.pytest.ini_options]
# 测试目录
testpaths = ["tests"]

# 命令行选项
addopts = """
    -v
    --tb=short
    --strict-markers
    --alluredir=allure-results
    --clean-alluredir
    -n auto
"""

# 标记定义
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "api: 接口测试",
    "ui: UI 测试",
    "data: 数据一致性测试",
    "smoke: 冒烟测试",
    "regression: 回归测试",
    "slow: 慢速测试",
]

# 日志配置
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# 超时设置
timeout = 300

# 失败重试
reruns = 1
reruns_delay = 2

# Playwright 配置
[tool.playwright]
# 浏览器配置
browsers = ["chromium"]

[tool.black]
line-length = 120
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 120
